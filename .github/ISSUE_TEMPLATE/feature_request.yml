name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        SymfoCMS aims to stay small and easy to use. Features that keep the editing experience simple have the best chance of being accepted.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and who is affected (editors, visitors, developers).
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: For example a workaround or a custom block type.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this myself
