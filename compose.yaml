# Starts SymfoCMS for development with one command:
#
#     docker compose up
#
# Then open http://localhost:8000 (log in with admin@example.com / demo-password).
# The source code is mounted into the container, so changes show up immediately.

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: dev
      # SQLite database inside the "var" volume. Override to use MySQL or PostgreSQL.
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data.db"
    volumes:
      - .:/app
      # Keep dependencies, cache and database in volumes: much faster than the mounted folder on Windows and macOS.
      - vendor:/app/vendor
      - var:/app/var

volumes:
  vendor:
  var:
