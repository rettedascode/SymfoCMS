framework:
    rate_limiter:
        # Public forms: at most 5 accepted submissions per form and visitor within 10 minutes.
        form_submission:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
        # Second step of the login: at most 5 codes per user within 15 minutes.
        two_factor:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
