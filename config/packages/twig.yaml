twig:
    file_name_pattern: '*.twig'
    form_themes: ['admin/form_theme.html.twig']
    paths:
        # The templates of the default theme are the fallback for every other theme.
        '%kernel.project_dir%/themes/default/templates': ~
        # Lets a theme extend a template of another one: "@themes/default/templates/site/base.html.twig".
        '%kernel.project_dir%/themes': themes
    globals:
        # "site_name" and "site_tagline" come from App\Twig\SiteGlobals.
        max_revisions: '%app.max_revisions%'

when@test:
    twig:
        strict_variables: true
